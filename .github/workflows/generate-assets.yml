name: Generate NeuroSync Assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'config.json'

jobs:
  generate-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Esto da permiso al robot para guardar cambios
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf
      
      - name: Run generation script
        run: python generate.py
      
      - name: Create PDF from HTML
        run: wkhtmltopdf guide.html assets/neurosync_guide.pdf
      
      - name: Commit and Push changes to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update generated assets [skip ci]" || echo "No changes to commit"
          git push
